name: Build TeaCut.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the source version (requires explicit release approval)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install pyinstaller imageio-ffmpeg tkinterdnd2 sv-ttk

      - name: Build TeaCut.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name TeaCut
          --icon assets/teacut.ico --add-data "assets/teacut.png;assets" --add-data "assets/teacut-small.png;assets"
          --collect-all imageio_ffmpeg --collect-all tkinterdnd2 --collect-all sv_ttk teacut.py

      - name: Smoke test the exe (cut, join, repair, convert)
        shell: pwsh
        run: |
          $ff = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc=s=320x240:d=6 -f lavfi -i sine=d=6 -c:v wmv2 -c:a wmav2 sample.wmv
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc2=s=640x360:d=4 -f lavfi -i sine=d=4 -c:v mpeg4 -c:a mp2 sample.avi
          $exe = "dist\TeaCut.exe"
          $jobs = @(
            @("cut", "sample.wmv", "--start", "1", "--end", "4", "-o", "out_cut.wmv"),
            @("join", "sample.wmv", "sample.avi", "-o", "out_join.mp4"),
            @("repair", "sample.wmv", "-o", "out_repair.wmv"),
            @("convert", "sample.wmv", "-o", "out_convert.mp4")
          )
          foreach ($a in $jobs) {
            # A windowed exe returns immediately unless we wait for it.
            $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru -NoNewWindow
            $out = $a[-1]
            if ($p.ExitCode -ne 0 -or -not (Test-Path $out) -or (Get-Item $out).Length -lt 1024) {
              throw "TeaCut $($a[0]) failed (exit $($p.ExitCode))"
            }
            Write-Host "OK: $($a[0]) -> $out ($((Get-Item $out).Length) bytes)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: TeaCut-windows
          path: dist/TeaCut.exe

      - name: Publish release (when VERSION in teacut.py is new)
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_sha=$(git rev-parse HEAD)
          version=$(python -c "import re; print(re.search(r'^VERSION = \"(.+?)\"', open('teacut.py').read(), re.M).group(1))")
          tag="v$version"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Manual releases require main" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag does not match source VERSION" >&2
            exit 1
          fi
          remote_refs=$(git ls-remote --exit-code origin "refs/tags/$tag" "refs/tags/$tag^{}") || {
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
            remote_refs=""
          }
          direct=""
          peeled=""
          while read -r sha ref; do
            [[ -n "$sha" ]] || continue
            case "$ref" in
              "refs/tags/$tag") direct="$sha" ;;
              "refs/tags/$tag^{}") peeled="$sha" ;;
              *) exit 1 ;;
            esac
          done <<< "$remote_refs"
          remote_sha="${peeled:-$direct}"
          [[ -z "$remote_sha" || "$remote_sha" == "$build_sha" ]] || {
            echo "Release tag differs from built commit" >&2
            exit 1
          }
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists - bump VERSION in teacut.py to publish a new one."
            exit 0
          fi
          cat > notes.md <<NOTES
          ## Download
          Get **TeaCut.exe** below and double-click it. There's nothing to install, and FFmpeg is built in.

          Windows SmartScreen may warn about an unrecognised app the first time: click *More info → Run anyway*.
          NOTES
          gh release create "$tag" dist/TeaCut.exe --target "$build_sha" --title "TeaCut $tag" --notes-file notes.md --generate-notes
